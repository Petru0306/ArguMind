<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:lang="${#locale.language}" th:fragment="main-layout(content, scripts)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{app.title} + ' — ' + #{app.tagline}">ArguMind</title>
    <link rel="icon" type="image/png" th:href="@{/images/favicon.png}">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'accent': '#D47E30', 'text-main': '#825E34', 'bg-main': '#FDFBD4',
                        'chai-bg': '#FDFBD4', 'chai-accent': '#D47E30', 'chai-dark': '#8D5A2B', 'chai-text': '#825E34'
                    },
                    fontFamily: { heading: ['Montserrat', 'sans-serif'], body: ['Poppins', 'sans-serif'] }
                }
            }
        }
    </script>
    <link rel="stylesheet" th:href="@{/css/global.css}">
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
</head>
<body class="min-h-screen flex flex-col bg-chai-bg font-body text-chai-text text-base">
    <div id="cursor-dot"></div>
    <div id="cursor-ring"></div>

    <nav class="sticky top-0 w-full bg-white/95 backdrop-blur-md z-[1000] border-b border-chai-dark/10 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6">
            <div class="flex justify-between items-center h-16 gap-4">
                <a href="/" class="flex items-center gap-2 shrink-0 nav-interactive">
                    <img th:src="@{/images/favicon.png}" alt="Logo" class="h-9 w-9 rounded-full">
                    <span class="text-xl font-heading font-bold text-chai-text hidden sm:inline">ArguMind</span>
                </a>

                <div class="hidden lg:flex items-center gap-1 text-sm font-semibold text-chai-text">
                    <a href="/topics" class="px-3 py-2 rounded-lg hover:bg-chai-bg hover:text-chai-accent nav-interactive" th:text="#{nav.topics}">Teme</a>

                    <div class="nav-dropdown relative group">
                        <button type="button" class="px-3 py-2 rounded-lg hover:bg-chai-bg hover:text-chai-accent nav-interactive flex items-center gap-1">
                            <span th:text="#{nav.modes}">Moduri</span> <span class="text-[10px] opacity-60">▼</span>
                        </button>
                        <div class="nav-dropdown-menu absolute left-0 top-full pt-1 min-w-[160px]">
                            <div class="bg-white rounded-xl border border-chai-dark/10 shadow-lg py-2">
                                <a href="/modes/blitz" class="block px-4 py-2 hover:bg-chai-bg nav-interactive" th:text="#{nav.modes.blitz}">Blitz</a>
                                <a href="/modes/rapid" class="block px-4 py-2 hover:bg-chai-bg nav-interactive" th:text="#{nav.modes.rapid}">Rapid</a>
                                <a href="/modes/standard" class="block px-4 py-2 hover:bg-chai-bg nav-interactive" th:text="#{nav.modes.standard}">Standard</a>
                                <a href="/modes/extended" class="block px-4 py-2 hover:bg-chai-bg nav-interactive" th:text="#{nav.modes.extended}">Extended</a>
                            </div>
                        </div>
                    </div>

                    <a href="/modes/teams_2v2" class="px-3 py-2 rounded-lg hover:bg-chai-bg hover:text-chai-accent nav-interactive" th:text="#{nav.modes.2v2}">2v2</a>
                    <a href="/ai-debate" sec:authorize="isAuthenticated()"
                       class="px-3 py-2 rounded-lg hover:bg-chai-bg hover:text-chai-accent nav-interactive" th:text="#{nav.debateAi}">Debate cu AI</a>
                    <a href="/login" sec:authorize="isAnonymous()"
                       class="px-3 py-2 rounded-lg hover:bg-chai-bg hover:text-chai-accent nav-interactive" th:text="#{nav.debateAi}">Debate cu AI</a>
                    <a href="/leaderboard" class="px-3 py-2 rounded-lg hover:bg-chai-bg hover:text-chai-accent nav-interactive" th:text="#{nav.leaderboard}">Leaderboard</a>
                    <a href="/lessons" class="px-3 py-2 rounded-lg hover:bg-chai-bg hover:text-chai-accent nav-interactive" th:text="#{nav.lessons}">Lecții</a>
                    <span class="w-px h-6 bg-chai-dark/15 mx-1"></span>
                    <a href="/fallacies" class="px-3 py-2 rounded-lg hover:bg-chai-bg hover:text-chai-accent nav-interactive" th:text="#{nav.fallacies}">Erori logice</a>
                    <a href="/about" class="px-3 py-2 rounded-lg hover:bg-chai-bg hover:text-chai-accent nav-interactive" th:text="#{nav.about}">Despre noi</a>
                </div>

                <div class="flex items-center gap-3 shrink-0">
                    <div class="hidden sm:flex gap-2 text-xs font-bold text-chai-dark/50">
                        <a th:href="${langSwitchRo}" class="hover:text-chai-accent nav-interactive"
                           th:classappend="${#locale.language == 'ro'} ? 'text-chai-accent' : ''">RO</a><span>/</span>
                        <a th:href="${langSwitchEn}" class="hover:text-chai-accent nav-interactive"
                           th:classappend="${#locale.language == 'en'} ? 'text-chai-accent' : ''">EN</a>
                    </div>

                    <div sec:authorize="isAnonymous()" class="flex gap-2">
                        <a href="/login" class="text-sm font-semibold px-3 py-2 hover:text-chai-accent nav-interactive" th:text="#{nav.login}">Login</a>
                        <a href="/register" class="text-sm font-bold bg-chai-accent text-white px-4 py-2 rounded-full hover:brightness-110 nav-interactive" th:text="#{nav.register}">Înregistrare</a>
                    </div>

                    <div sec:authorize="isAuthenticated()" class="flex items-center gap-3">
                        <a href="/dashboard" class="hidden md:inline text-sm font-semibold hover:text-chai-accent nav-interactive" th:text="#{nav.dashboard}">Dashboard</a>
                        <div th:if="${navUser != null}" class="flex items-center gap-2 bg-chai-bg border border-chai-dark/10 rounded-full pl-1 pr-3 py-1">
                            <div class="w-8 h-8 rounded-full bg-chai-dark text-white flex items-center justify-center text-xs font-bold"
                                 th:text="${#strings.substring(navUser.username, 0, 1).toUpperCase()}">A</div>
                            <div class="text-left leading-tight">
                                <span class="block text-sm font-bold text-chai-text max-w-[120px] truncate" th:text="${navUser.username}">user</span>
                                <span class="block text-[11px] text-chai-accent font-semibold"
                                      th:with="rk=${'rank.' + navUser.rankTitle}"
                                      th:text="${navUser.eloRating} + ' ELO · ' + #{${rk}}">1000 ELO</span>
                            </div>
                        </div>
                        <a href="/profile" class="text-sm font-semibold hover:text-chai-accent hidden sm:inline nav-interactive" th:text="#{nav.profile}">Profil</a>
                        <form th:action="@{/logout}" method="post" class="inline">
                            <button type="submit" class="text-sm font-semibold text-red-600/80 hover:text-red-600 nav-interactive" th:text="#{nav.logout}">Logout</button>
                        </form>
                    </div>
                </div>
            </div>
            <div class="lg:hidden flex gap-1 overflow-x-auto pb-2 text-xs font-semibold border-t border-chai-dark/5 pt-2">
                <a href="/topics" class="px-2 py-1 bg-chai-bg rounded-md whitespace-nowrap" th:text="#{nav.topics}">Teme</a>
                <a href="/modes/rapid" class="px-2 py-1 bg-chai-bg rounded-md whitespace-nowrap" th:text="#{nav.modes}">Moduri</a>
                <a href="/modes/teams_2v2" class="px-2 py-1 bg-chai-bg rounded-md whitespace-nowrap" th:text="#{nav.modes.2v2}">2v2</a>
                <a href="/ai-debate" class="px-2 py-1 bg-chai-bg rounded-md whitespace-nowrap" th:text="#{nav.debateAi}">Debate AI</a>
                <a href="/leaderboard" class="px-2 py-1 bg-chai-bg rounded-md whitespace-nowrap" th:text="#{nav.leaderboard}">Leaderboard</a>
                <a href="/lessons" class="px-2 py-1 bg-chai-bg rounded-md whitespace-nowrap" th:text="#{nav.lessons}">Lecții</a>
            </div>
        </div>
    </nav>

    <main class="flex-grow">
        <div th:replace="${content}"></div>
    </main>

    <footer class="bg-white border-t border-chai-dark/10 py-8 mt-12">
        <div class="max-w-7xl mx-auto px-6 flex flex-col md:flex-row justify-between items-center gap-4 text-sm text-chai-dark/70">
            <p class="font-semibold" th:text="#{footer.copyright}">&copy; 2026 ArguMind</p>
            <div class="flex gap-6">
                <a href="/lessons" class="hover:text-chai-accent nav-interactive" th:text="#{footer.lessons}">Lecții</a>
                <a href="/about" class="hover:text-chai-accent nav-interactive" th:text="#{footer.about}">Despre</a>
                <a href="/fallacies" class="hover:text-chai-accent nav-interactive" th:text="#{footer.fallacies}">Erori logice</a>
                <a href="/leaderboard" class="hover:text-chai-accent nav-interactive" th:text="#{footer.leaderboard}">Leaderboard</a>
            </div>
        </div>
    </footer>

    <th:block th:if="${scripts != null}" th:replace="${scripts}"></th:block>
    <script th:src="@{/js/global.js}"></script>
</body>
</html>
