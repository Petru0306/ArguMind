<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: main-layout(~{::main}, ~{::scripts})}">
<body>
<main class="py-10 px-4">
    <div class="max-w-2xl mx-auto">
        <h1 class="text-3xl font-heading font-bold text-chai-text mb-2" th:text="#{profile.title}">Profilul meu</h1>
        <p class="text-chai-dark/70 mb-8" th:text="#{profile.account(${profileUser.username})}">Cont: user</p>

        <p th:if="${successKey}" th:text="#{${successKey}}" class="mb-4 rounded-xl bg-green-50 border border-green-200 px-4 py-3 text-green-800 text-sm"></p>
        <p th:if="${success}" th:text="${success}" class="mb-4 rounded-xl bg-green-50 border border-green-200 px-4 py-3 text-green-800 text-sm"></p>
        <p th:if="${errorKey}" th:text="#{${errorKey}}" class="mb-4 rounded-xl bg-red-50 border border-red-200 px-4 py-3 text-red-700 text-sm"></p>
        <p th:if="${error}" th:text="${error}" class="mb-4 rounded-xl bg-red-50 border border-red-200 px-4 py-3 text-red-700 text-sm"></p>

        <div class="bg-white rounded-2xl border border-chai-dark/10 p-8 shadow-lg mb-8 hover-card">
            <div class="grid grid-cols-2 gap-6 mb-8 text-center">
                <div class="bg-chai-bg rounded-xl p-4">
                    <span class="block text-sm text-chai-dark/60" th:text="#{profile.elo}">ELO</span>
                    <span class="text-2xl font-bold text-chai-accent" th:text="${currentUserElo}">1000</span>
                </div>
                <div class="bg-chai-bg rounded-xl p-4">
                    <span class="block text-sm text-chai-dark/60" th:text="#{profile.rank}">Rang</span>
                    <span class="text-2xl font-bold" th:text="${currentUserRank}">NOVICE</span>
                </div>
                <div class="bg-chai-bg rounded-xl p-4">
                    <span class="block text-sm text-chai-dark/60" th:text="#{profile.wins}">Victorii</span>
                    <span class="text-2xl font-bold" th:text="${wins}">0</span>
                </div>
                <div class="bg-chai-bg rounded-xl p-4">
                    <span class="block text-sm text-chai-dark/60" th:text="#{profile.losses}">Înfrângeri</span>
                    <span class="text-2xl font-bold" th:text="${losses}">0</span>
                </div>
            </div>

            <form th:action="@{/profile}" method="post" class="space-y-4">
                <div>
                    <label class="block text-sm font-semibold mb-2" th:text="#{profile.username}">Username</label>
                    <input type="text" th:value="${profileUser.username}" disabled
                           class="w-full px-4 py-3 rounded-xl border border-chai-dark/20 bg-chai-bg/50 text-chai-dark/60">
                </div>
                <div>
                    <label for="email" class="block text-sm font-semibold mb-2" th:text="#{profile.email}">Email</label>
                    <input type="email" id="email" name="email" required th:value="${profileUser.email}"
                           class="w-full px-4 py-3 rounded-xl border border-chai-dark/20 outline-none focus:border-chai-accent">
                </div>
                <button type="submit" class="w-full bg-chai-accent text-white py-3 rounded-xl font-bold hover:brightness-110" th:text="#{profile.save}">
                    Salvează modificările
                </button>
            </form>
        </div>

        <div class="bg-white rounded-2xl border border-chai-dark/10 p-8 shadow-lg mb-8 hover-card" th:if="${not #lists.isEmpty(friendRequests)}">
            <h2 class="text-xl font-heading font-bold mb-4" th:text="#{profile.friends.requests}">Cereri de prietenie</h2>
            <ul class="space-y-3">
                <li th:each="r : ${friendRequests}" class="flex items-center justify-between gap-4 p-4 bg-chai-bg/50 rounded-xl">
                    <a th:href="@{/player/{u}(u=${r.username})}" class="font-bold text-chai-text hover:text-chai-accent" th:text="${r.username}">user</a>
                    <button type="button" class="accept-friend-btn bg-green-600 text-white px-4 py-2 rounded-lg text-sm font-bold"
                            th:attr="data-id=${r.friendshipId}" th:text="#{profile.friends.accept}">Acceptă</button>
                </li>
            </ul>
        </div>

        <div class="bg-white rounded-2xl border border-chai-dark/10 p-8 shadow-lg mb-8 hover-card">
            <h2 class="text-xl font-heading font-bold mb-4"><span th:text="#{profile.friends.title}">Prieteni</span> <span class="text-chai-accent text-base" th:text="'(' + ${#lists.size(friends)} + ')'">(0)</span></h2>
            <div th:if="${#lists.isEmpty(friends)}" class="text-chai-dark/50 italic text-sm" th:utext="#{profile.friends.empty}">
                Niciun prieten încă. Adaugă jucători din leaderboard.
            </div>
            <ul th:unless="${#lists.isEmpty(friends)}" class="grid sm:grid-cols-2 gap-3">
                <li th:each="f : ${friends}">
                    <a th:href="@{/player/{u}(u=${f.username})}"
                       class="flex items-center gap-3 p-4 bg-chai-bg/50 rounded-xl border border-chai-dark/5 hover:border-chai-accent/40 transition-colors">
                        <div class="w-10 h-10 rounded-full bg-chai-dark text-white flex items-center justify-center font-bold text-sm"
                             th:text="${#strings.substring(f.username, 0, 1).toUpperCase()}">A</div>
                        <div>
                            <span class="block font-bold text-sm" th:text="${f.username}">user</span>
                            <span class="text-xs text-chai-accent" th:text="${f.eloRating} + ' ELO'">1000</span>
                        </div>
                    </a>
                </li>
            </ul>
        </div>

        <a href="/dashboard" class="text-chai-accent font-bold hover:underline" th:text="#{profile.back}">← Dashboard</a>
    </div>
</main>

<th:block th:fragment="scripts">
<script>
    document.querySelectorAll('.accept-friend-btn').forEach(btn => {
        btn.addEventListener('click', async () => {
            const res = await fetch('/api/friends/accept/' + btn.dataset.id, { method: 'POST', credentials: 'same-origin' });
            if (res.ok) location.reload();
        });
    });
</script>
</th:block>
</body>
</html>
