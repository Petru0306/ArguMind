<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ro" th:fragment="layout(content)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ArguMind — Gândește Clar</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'chai-bg': '#FDFBD4',     // Alb crem
                        'chai-accent': '#D47E30', // Teracotă
                        'chai-dark': '#8D5A2B',   // Maro mediu
                        'chai-text': '#825E34',   // Maro închis
                    },
                    fontFamily: {
                        heading: ['Montserrat', 'sans-serif'],
                        body: ['Poppins', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Poppins', sans-serif; background-color: #FDFBD4; color: #825E34; }
        h1, h2, h3 { font-family: 'Montserrat', sans-serif; }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- Navbar -->
    <nav class="bg-chai-dark text-white shadow-lg">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <div class="flex items-center">
                    <a href="/" class="text-2xl font-heading font-bold tracking-tight">ArguMind</a>
                </div>
                <div class="hidden md:flex items-center space-x-8">
                    <!-- Language Selector -->
                    <div class="flex space-x-2 text-sm">
                        <a href="?lang=ro" class="hover:text-chai-bg transition-colors">RO</a>
                        <span>|</span>
                        <a href="?lang=en" class="hover:text-chai-bg transition-colors">EN</a>
                    </div>
                    
                    <div th:if="${#authorization.expression('isAnonymous()')}" class="flex items-center space-x-4">
                        <a href="/login" th:text="#{auth.login.submit}" class="hover:underline">Autentificare</a>
                        <a href="/register" th:text="#{auth.register.title}" class="bg-chai-accent px-4 py-2 rounded-lg font-semibold hover:brightness-110 transition-all">Înregistrare</a>
                    </div>
                    <div th:if="${#authorization.expression('isAuthenticated()')}" class="flex items-center space-x-4">
                        <a href="/dashboard" class="hover:underline">Dashboard</a>
                        <form th:action="@{/logout}" method="post" class="inline">
                            <button type="submit" class="bg-red-700 px-4 py-2 rounded-lg text-sm font-semibold hover:bg-red-800">Logout</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <!-- Content Placeholder -->
    <main class="flex-grow">
        <div th:replace="${content}"></div>
    </main>

    <!-- Footer -->
    <footer class="bg-chai-dark text-white/80 py-8 mt-12">
        <div class="max-w-7xl mx-auto px-4 text-center border-t border-white/10 pt-8">
            <p>&copy; 2026 ArguMind — Proiect dezvoltat pentru InfoEducație.</p>
        </div>
    </footer>

</body>
</html>
