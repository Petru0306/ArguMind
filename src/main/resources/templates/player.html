<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{fragments/layout :: main-layout(~{::main}, ~{::scripts})}">
<body>
<main class="py-10 px-4">
    <div class="max-w-3xl mx-auto">
        <div class="bg-white rounded-3xl border border-chai-dark/10 shadow-xl p-8 md:p-10 hover-card">
            <div class="flex flex-col sm:flex-row justify-between items-start gap-4 mb-8">
                <div class="flex items-center gap-5">
                    <div class="w-20 h-20 rounded-2xl bg-chai-dark text-white flex items-center justify-center text-3xl font-black"
                         th:text="${#strings.substring(profile.username, 0, 1).toUpperCase()}">A</div>
                    <div>
                        <h1 class="text-3xl font-heading font-bold text-chai-text" th:text="${profile.username}">user</h1>
                        <p class="text-chai-accent font-bold mt-1" th:text="${profile.eloRating} + ' ELO · ' + ${profile.rankTitle}">1000 ELO</p>
                    </div>
                </div>
                <div sec:authorize="isAuthenticated()" th:if="${friendRelation != 'SELF'}" class="shrink-0">
                    <button type="button" id="btn-add-friend" th:if="${friendRelation == 'NONE'}"
                            th:attr="data-username=${profile.username}"
                            class="bg-chai-accent text-white px-5 py-2.5 rounded-xl font-bold text-sm btn-glow"
                            th:text="#{player.friend.add}">
                        + Adaugă prieten
                    </button>
                    <span th:if="${friendRelation == 'PENDING_OUT'}"
                          class="inline-block px-5 py-2.5 rounded-xl bg-chai-bg border border-chai-dark/20 text-sm font-semibold text-chai-dark/70"
                          th:text="#{player.friend.pendingOut}">
                        Cerere trimisă
                    </span>
                    <button type="button" th:if="${friendRelation == 'PENDING_IN'}"
                            th:attr="data-friendship-id=${incomingFriendshipId}"
                            id="btn-accept-friend"
                            class="bg-green-600 text-white px-5 py-2.5 rounded-xl font-bold text-sm"
                            th:text="#{player.friend.accept}">
                        Acceptă cererea
                    </button>
                    <span th:if="${friendRelation == 'FRIENDS'}"
                          class="inline-block px-5 py-2.5 rounded-xl bg-green-50 border border-green-200 text-sm font-semibold text-green-800"
                          th:text="#{player.friend.friends}">
                        ✓ Prieten
                    </span>
                </div>
            </div>

            <p id="friend-msg" class="hidden mb-4 text-sm rounded-xl px-4 py-2"></p>

            <div class="grid grid-cols-3 gap-4 mb-8 text-center">
                <div class="bg-chai-bg rounded-2xl p-4">
                    <span class="block text-2xl font-bold text-chai-accent" th:text="${profile.wins}">0</span>
                    <span class="text-xs uppercase text-chai-dark/60" th:text="#{player.wins}">Victorii</span>
                </div>
                <div class="bg-chai-bg rounded-2xl p-4">
                    <span class="block text-2xl font-bold text-chai-text" th:text="${profile.losses}">0</span>
                    <span class="text-xs uppercase text-chai-dark/60" th:text="#{player.losses}">Înfrângeri</span>
                </div>
                <div class="bg-chai-bg rounded-2xl p-4">
                    <span class="block text-2xl font-bold text-chai-text" th:text="${profile.totalMatches}">0</span>
                    <span class="text-xs uppercase text-chai-dark/60" th:text="#{player.matches}">Meciuri</span>
                </div>
            </div>

            <h2 class="text-lg font-heading font-bold mb-4" th:text="#{player.recent.title}">Meciuri recente</h2>
            <div th:if="${#lists.isEmpty(profile.recentMatches)}" class="text-chai-dark/50 italic text-sm" th:text="#{player.recent.empty}">
                Niciun meci finalizat încă.
            </div>
            <ul th:unless="${#lists.isEmpty(profile.recentMatches)}" class="space-y-3">
                <li th:each="m : ${profile.recentMatches}"
                    class="p-4 bg-chai-bg/50 rounded-xl border border-chai-dark/5 flex justify-between items-center gap-4">
                    <div>
                        <p class="font-semibold text-sm text-chai-text" th:text="${m.topic}">Tema</p>
                        <span class="text-[10px] uppercase font-bold text-chai-dark/40" th:text="${m.gameMode}">STANDARD</span>
                    </div>
                    <span class="text-xs font-bold px-3 py-1 rounded-full"
                          th:classappend="${m.winner != null && m.winner.id == profile.id} ? 'bg-green-100 text-green-800' : 'bg-red-100 text-red-800'"
                          th:text="${m.winner != null && m.winner.id == profile.id} ? #{common.victory} : #{common.defeat}">W</span>
                </li>
            </ul>
        </div>

        <p class="text-center mt-8">
            <a href="/leaderboard" class="text-chai-accent font-bold hover:underline" th:text="#{player.back}">← Leaderboard</a>
        </p>
    </div>
</main>

<th:block th:fragment="scripts">
<script th:inline="javascript" sec:authorize="isAuthenticated()">
    window.i18n = {
        friendSent: /*[[#{player.friend.sent}]]*/ '',
        pendingOut: /*[[#{player.friend.pendingOut}]]*/ '',
        errorGeneric: /*[[#{error.generic}]]*/ ''
    };
</script>
<script sec:authorize="isAuthenticated()">
    const msgEl = document.getElementById('friend-msg');
    function showFriendMsg(text, ok) {
        msgEl.textContent = text;
        msgEl.className = 'mb-4 text-sm rounded-xl px-4 py-2 ' + (ok ? 'bg-green-50 text-green-800 border border-green-200' : 'bg-red-50 text-red-700 border border-red-200');
        msgEl.classList.remove('hidden');
    }

    document.getElementById('btn-accept-friend')?.addEventListener('click', async function () {
        const id = this.dataset.friendshipId;
        try {
            const res = await fetch('/api/friends/accept/' + id, { method: 'POST', credentials: 'same-origin' });
            const data = await res.json();
            if (!res.ok) throw new Error(data.error || window.i18n.errorGeneric);
            location.reload();
        } catch (e) {
            showFriendMsg(e.message, false);
        }
    });

    document.getElementById('btn-add-friend')?.addEventListener('click', async function () {
        const username = this.dataset.username;
        try {
            const res = await fetch('/api/friends/request', {
                method: 'POST', credentials: 'same-origin',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username })
            });
            const data = await res.json();
            if (!res.ok) throw new Error(data.error || window.i18n.errorGeneric);
            showFriendMsg(data.message || window.i18n.friendSent, true);
            this.replaceWith(Object.assign(document.createElement('span'), {
                className: 'inline-block px-5 py-2.5 rounded-xl bg-chai-bg border text-sm font-semibold text-chai-dark/70',
                textContent: window.i18n.pendingOut
            }));
        } catch (e) {
            showFriendMsg(e.message, false);
        }
    });
</script>
</th:block>
</body>
</html>
