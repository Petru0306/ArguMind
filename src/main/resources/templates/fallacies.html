<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: main-layout(~{::main}, ~{})}">
<body>
<main class="py-10 px-4">
    <div class="max-w-5xl mx-auto">
        <h1 class="text-3xl font-heading font-bold text-chai-text mb-2" th:text="#{fallacies.page.title}">Erori logice (Logical Fallacies)</h1>
        <p class="text-base text-chai-dark/70 mb-10" th:text="#{fallacies.page.subtitle}">
            Catalog educațional — AI-ul ArguMind caută aceste tipare în argumentele din meciuri.
        </p>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <article th:each="f : ${fallacyGuides}" class="bg-white p-6 rounded-2xl border border-chai-dark/10 shadow-sm hover:border-chai-accent/40 transition-colors">
                <div class="flex justify-between items-start mb-3">
                    <h2 class="text-lg font-heading font-bold text-chai-text" th:text="${f.name}">Nume</h2>
                    <span class="text-xs font-bold uppercase bg-chai-bg px-2 py-1 rounded text-chai-dark/60" th:text="${f.getDisplayCategory(#locale)}">Cat</span>
                </div>
                <p class="text-sm text-chai-dark/80 mb-4" th:text="${f.getDisplayDescription(#locale)}">Desc</p>
                <div class="bg-red-50 border-l-4 border-red-400 p-3 mb-3 rounded-r-lg">
                    <p class="text-xs font-bold text-red-800 uppercase mb-1" th:text="#{fallacies.page.example}">Exemplu</p>
                    <p class="text-sm text-red-900/90 italic" th:text="${f.getDisplayExample(#locale)}">Ex</p>
                </div>
                <div class="bg-green-50 p-3 rounded-lg">
                    <p class="text-xs font-bold text-green-800 uppercase mb-1" th:text="#{fallacies.page.avoid}">Cum eviți</p>
                    <p class="text-sm text-green-900/90" th:text="${f.getDisplayHowToAvoid(#locale)}">Tip</p>
                </div>
            </article>
        </div>

        <p th:if="${#lists.isEmpty(fallacyGuides)}" class="text-center text-chai-dark/50 py-12" th:text="#{fallacies.page.empty}">
            Catalogul se încarcă la prima pornire a aplicației. Repornește serverul dacă e gol.
        </p>
    </div>
</main>
</body>
</html>
