# --- Lessons index ---
lessons.index.title=ArguMind Lessons
lessons.index.subtitle=5 practical modules — from structure to rebuttals, evidence, and clear rhetoric.
lessons.index.1.tag=Lesson 1 · Foundations
lessons.index.1.title=Argumentation basics: from opinion to proof
lessons.index.1.desc=PRO/CONTRA structure, premises, evidence, common fallacies, and a pre-match checklist.
lessons.index.1.link=Start lesson →
lessons.index.2.tag=Lesson 2 · Rebuttals
lessons.index.2.title=The art of rebuttal: respond, don't repeat
lessons.index.2.desc=PREL method, rebuttal types (premise, mechanism, priority), and a 60-second exercise.
lessons.index.3.tag=Lesson 3 · Strategy
lessons.index.3.title=Think like your opponent: anticipation in 2 minutes
lessons.index.3.desc=Map of 3 attacks, steelman technique, and a quick pre-arena prep pack.
lessons.index.4.tag=Lesson 4 · Evidence
lessons.index.4.title=Evidence pyramid: what convinces the AI referee
lessons.index.4.desc=Evidence hierarchy, one-sentence formula, honesty when studies are missing — no invented percentages.
lessons.index.5.tag=Lesson 5 · Rhetoric
lessons.index.5.title=Clarity and impact: rhetoric without manipulation
lessons.index.5.desc=Rule of 3 ideas, proper hooks, precise words, and memorable closings for clarity scores.

