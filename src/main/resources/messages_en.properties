# --- About ---
about.title=About ArguMind
about.intro=ArguMind is an educational turn-based debate platform built for InfoEducație. Our goal is to train critical thinking through PRO vs CONTRA duels with instant feedback from an AI referee.
about.how.title=How it works
about.how.step1=Create an account and open your dashboard.
about.how.step2=Open a private lobby and send the code to a friend.
about.how.step3=Take turns submitting arguments — 2 rounds, time limits per mode (Blitz / Rapid / Standard).
about.how.step4=Gemini AI scores logic, clarity, evidence, and detects logical fallacies.
about.how.step5=Your ELO updates; climb the leaderboard.
about.team.title=Team & mission
about.team.text=We believe structured debate is a superpower in the information age. ArguMind combines custom design, WebSockets, Spring Boot, and AI integration for an accessible “intellectual esport” experience for students.
about.footer.note=Educational open-source project · Spiced Chai palette · Layered Spring Boot 3 architecture
about.cta.start=Get started
about.cta.fallacies=Learn logical fallacies

