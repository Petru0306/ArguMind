# --- About ---
about.title=Despre ArguMind
about.intro=ArguMind este o platformă educațională de dezbateri turn-based, dezvoltată pentru InfoEducație. Scopul nostru: să antrenăm gândirea critică prin dueluri PRO vs CONTRA, cu feedback instant de la un arbitru AI.
about.how.title=Cum funcționează
about.how.step1=Creezi un cont și intri în dashboard.
about.how.step2=Deschizi un lobby privat și trimiți codul unui prieten.
about.how.step3=Alternați argumentele — 2 runde, timp limitat per mod (Blitz / Rapid / Standard).
about.how.step4=AI-ul Gemini evaluează logică, claritate, dovezi și detectează erori logice.
about.how.step5=ELO-ul se actualizează; urcă în leaderboard.
about.team.title=Echipa & misiune
about.team.text=Credem că debatarea structurată este o super-putere în era informației. ArguMind combină design propriu, WebSockets, Spring Boot și integrare AI pentru o experiență de „esport intelectual” accesibilă elevilor și studenților.
about.footer.note=Proiect open-source educațional · Paletă Spiced Chai · Arhitectură stratificată Spring Boot 3
