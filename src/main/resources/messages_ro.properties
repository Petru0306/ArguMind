lessons.index.1.tag=Lecția 1 · Fundamente
lessons.index.1.title=Bazele argumentării: de la opinie la demonstrație
lessons.index.1.desc=Structura PRO/CONTRA, premisa, dovezi, erori logice frecvente și checklist înainte de un meci.
lessons.index.1.link=Începe lecția →
lessons.index.2.tag=Lecția 2 · Replici
lessons.index.2.title=Arta replicii: răspunde, nu repeta
lessons.index.2.desc=Metoda PREL, tipuri de replici (premisă, mecanism, prioritate) și exercițiu de 60 de secunde.
lessons.index.3.tag=Lecția 3 · Strategie
lessons.index.3.title=Gândește ca adversarul: anticiparea în 2 minute
lessons.index.3.desc=Harta celor 3 atacuri, tehnica steelman și pachetul de pregătire rapidă înainte de arenă.
lessons.index.4.tag=Lecția 4 · Dovezi
lessons.index.4.title=Piramida dovezilor: ce convinge arbitrul AI
lessons.index.4.desc=Ierarhia dovezilor, formula într-o propoziție, onestitate când lipsesc studiile — fără procente inventate.
lessons.index.5.tag=Lecția 5 · Retorică
lessons.index.5.title=Claritate și impact: retorică fără manipulare
lessons.index.5.desc=Regula celor 3 idei, hook-uri corecte, cuvinte precise și închideri memorabile pentru scor la claritate.

