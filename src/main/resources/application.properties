spring.application.name=ArguMind

spring.messages.basename=messages
spring.messages.encoding=UTF-8
spring.web.locale.default=ro

# Development local cu H2 (fără PostgreSQL). Pentru Postgres, comentează linia de mai jos.
spring.profiles.active=local

# Chei locale (application-secrets.properties — gitignored)
spring.config.import=optional:classpath:application-secrets.properties

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/argumind
spring.datasource.username=ArguMind
spring.datasource.password=argumind123
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
# După update cod: repornește aplicația ca Hibernate să adauge coloane noi (ex: matches.created_at, users.email).
# Dacă matchmaking dă 500, rulează în PostgreSQL:
#   ALTER TABLE matches ADD COLUMN IF NOT EXISTS created_at TIMESTAMP(6) WITH TIME ZONE;
#   UPDATE matches SET created_at = NOW() WHERE created_at IS NULL;
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Integrare Gemini AI — cheia în application-secrets.properties (nu suprascrie cu variabilă goală)
ai.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent
