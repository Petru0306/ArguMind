spring.application.name=ArguMind

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/argumind
spring.datasource.username=ArguMind
spring.datasource.password=argumind123
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Integrare Gemini AI
ai.api.key=${AI_API_KEY:}
ai.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent
